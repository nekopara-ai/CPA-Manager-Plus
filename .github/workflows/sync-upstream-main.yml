name: Sync upstream main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patched-image.yml
      - .github/workflows/sync-upstream-main.yml
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nekopara-ai/CPA-Manager-Plus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_BRANCH: codex/cpamp-effective-tier

    steps:
      - name: Disable inherited upstream publishing workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for workflow in \
            release.yml \
            release-publish-recovery.yml \
            release-telegram-recovery.yml
          do
            gh api \
              --method PUT \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable"
          done

      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main

      - name: Checkout patched image branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0

      - name: Merge synchronized main into patched image branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          source_sha="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "${PATCH_BRANCH} already contains origin/main"
          else
            if ! git merge --no-edit origin/main; then
              echo "Automatic merge into ${PATCH_BRANCH} has conflicts:" >&2
              git diff --name-only --diff-filter=U >&2 || true
              git merge --abort || true
              exit 1
            fi

            source_sha="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/${PATCH_BRANCH}"
          fi

          existing_runs="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/patched-image.yml/runs" \
              -f branch="${PATCH_BRANCH}" \
              -f head_sha="${source_sha}" \
              -f per_page=1 \
              --jq '.total_count'
          )"
          if [[ "${existing_runs}" == "0" ]]; then
            # Pushes made by GITHUB_TOKEN do not start another workflow. Use
            # workflow_dispatch so every newly synchronized source is built.
            gh workflow run patched-image.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${PATCH_BRANCH}" \
              -f source_sha="${source_sha}"
          else
            echo "A patched-image run already exists for ${source_sha}"
          fi
